<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkCam Pro UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; overflow: hidden; -webkit-font-smoothing: antialiased; }
        
        /* Grid Overlay Kamera */
        .grid-lines { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; }
        .grid-lines div { border: 0.5px solid rgba(255, 255, 255, 0.2); }

        /* Zoom Controller Pill */
        .zoom-pill { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); border-radius: 9999px; }
        .zoom-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; font-weight: bold; transition: all 0.2s; }
        .zoom-active { background-color: rgba(255, 255, 255, 0.2); color: #facc15; border: 1px solid #facc15; }

        /* Custom Scrollbar for Gallery */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="font-sans h-screen w-screen relative select-none">

    <!-- CAMERA CONTAINER -->
    <div class="relative w-full h-full bg-black overflow-hidden flex items-center justify-center">
        
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover transition-transform duration-300"></video>
        <canvas id="canvas" class="hidden"></canvas>

        <div class="absolute inset-0 grid-lines z-10">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
        </div>

        <!-- TOP BAR UI -->
        <div class="absolute top-0 left-0 right-0 z-20 p-5 pt-8 bg-gradient-to-b from-black/80 via-black/30 to-transparent flex justify-between items-center text-white">
            <button id="btn-flash" onclick="toggleFlash()" class="p-2 rounded-full active:scale-95 text-lg">⚡</button>
            <span class="text-xs font-semibold tracking-wider bg-black/40 px-2.5 py-1 rounded-full border border-white/20">12M</span>
            <button onclick="toggleModal('profil')" class="p-2 text-sm bg-black/40 rounded-full border border-white/20 active:scale-95">👤 Profil</button>
            <button onclick="toggleModal('desc')" class="p-2 text-sm bg-black/40 rounded-full border border-white/20 active:scale-95">📝 Catatan</button>
        </div>

        <!-- BOTTOM CONTROL PANEL UI -->
        <div class="absolute bottom-0 left-0 right-0 z-20 pb-8 pt-12 bg-gradient-to-t from-black via-black/80 to-transparent flex flex-col items-center gap-5">
            
            <div class="zoom-pill flex items-center p-1 gap-1 border border-white/10">
                <button onclick="setZoom(0.6, this)" class="zoom-btn text-white/70">.6</button>
                <button onclick="setZoom(1.0, this)" class="zoom-btn zoom-active">1x</button>
                <button onclick="setZoom(2.0, this)" class="zoom-btn text-white/70">2</button>
                <button onclick="setZoom(3.0, this)" class="zoom-btn text-white/70">3</button>
            </div>

            <div class="w-full px-8 flex items-center justify-between">
                <button onclick="openGalleryTab()" class="w-12 h-12 rounded-2xl border border-white/30 overflow-hidden bg-zinc-800/80 flex items-center justify-center active:scale-95 transition">
                    <span class="text-xs text-white">🖼️</span>
                </button>

                <button onclick="processPhotoWorkflow()" class="w-20 h-20 bg-white rounded-full border-4 border-zinc-400 active:scale-90 transition shadow-2xl flex items-center justify-center">
                    <div class="w-16 h-16 rounded-full border-2 border-black/10"></div>
                </button>

                <button onclick="flipCamera()" class="w-12 h-12 rounded-full bg-zinc-800/80 border border-white/20 flex items-center justify-center text-xl active:rotate-180 transition-transform duration-300">
                    🔄
                </button>
            </div>

            <div class="flex justify-center gap-6 text-xs font-bold tracking-widest text-white/60 pt-2">
                <span class="hover:text-white cursor-pointer">PORTRAIT</span>
                <span class="text-yellow-400 border-b-2 border-yellow-400 pb-0.5">PHOTO</span>
                <span class="hover:text-white cursor-pointer">VIDEO</span>
                <span class="hover:text-white cursor-pointer">MORE</span>
            </div>
        </div>
    </div>

    <!-- MODAL PROFIL -->
    <div id="modal-profil" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-3xl max-w-xs w-full relative shadow-2xl">
            <button onclick="toggleModal('profil')" class="absolute top-4 right-4 text-zinc-400 hover:text-white">✕</button>
            <h3 class="text-lg font-bold mb-4 text-yellow-400">Identitas Pengambil Foto</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-zinc-400">Nama Lengkap</label>
                    <input type="text" id="profil-nama" value="Heri Prasetyo" class="w-full mt-1 p-3 bg-zinc-800 border border-zinc-700 rounded-xl text-sm text-white focus:outline-none focus:border-yellow-400">
                </div>
                <button onclick="saveProfil()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-xl hover:bg-yellow-300 transition">SIMPAN</button>
            </div>
        </div>
    </div>

    <!-- MODAL CATATAN -->
    <div id="modal-desc" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-3xl max-w-xs w-full relative shadow-2xl">
            <button onclick="toggleModal('desc')" class="absolute top-4 right-4 text-zinc-400 hover:text-white">✕</button>
            <h3 class="text-lg font-bold mb-4 text-yellow-400">Keterangan Pekerjaan</h3>
            <div class="space-y-4">
                <textarea id="input-desc" rows="4" placeholder="Masukkan rincian pekerjaan..." class="w-full p-3 bg-zinc-800 border border-zinc-700 rounded-xl text-sm text-white focus:outline-none focus:border-yellow-400"></textarea>
                <button onclick="toggleModal('desc')" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-xl hover:bg-yellow-300 transition">GUNAKAN TEKS INI</button>
            </div>
        </div>
    </div>

    <!-- GALERI MODERN (DARK UI & KALENDER FILTER) -->
    <div id="modal-gallery" class="fixed inset-0 bg-black hidden z-[100] flex flex-col pt-10 px-4 pb-24 overflow-y-auto">
        <!-- Header Galeri -->
        <div class="flex justify-between items-center py-4 border-b border-zinc-900">
            <div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Gallery</h2>
                <p id="gallery-sub-header" class="text-xs text-zinc-500 font-medium">Agustus 2026</p>
            </div>
            <button onclick="toggleModal('gallery')" class="text-zinc-400 hover:text-white font-bold bg-zinc-900 p-2 rounded-full">✕</button>
        </div>

        <!-- Gallery Feed Views -->
        <div id="view-feed" class="flex flex-col gap-6 mt-6"></div>
        <div id="view-calendar" class="hidden mt-6">
            <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
        </div>

        <div id="gallery-loading" class="hidden text-center py-16 text-zinc-600 text-xs">Memuat galeri foto...</div>

        <!-- Floating Tab Bar (Navigasi Galeri) -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900/90 backdrop-blur-xl border border-white/10 px-6 py-2.5 rounded-full flex gap-8 items-center shadow-2xl z-[120]">
            <button onclick="switchGalleryView('feed')" id="tab-feed" class="text-white text-lg">🏠</button>
            <button onclick="switchGalleryView('calendar')" id="tab-calendar" class="text-zinc-500 text-lg">📅</button>
        </div>
    </div>

    <!-- LIGHTBOX PREVIEW (IMAGE CLICK WITH BLUR BACKGROUND) -->
    <div id="modal-preview" class="fixed inset-0 bg-black/70 backdrop-blur-2xl hidden z-[200] flex flex-col items-center justify-between p-6">
        <div class="w-full flex justify-end">
            <button onclick="closePreview()" class="text-white bg-zinc-800/80 p-3 rounded-full text-sm">✕</button>
        </div>
        <div class="relative w-full max-w-md my-auto flex justify-center">
            <img id="preview-img" src="" class="max-h-[70vh] w-auto rounded-3xl object-contain shadow-2xl border border-white/10">
        </div>
        <div class="w-full text-center pb-6">
            <p id="preview-date" class="text-yellow-400 font-bold text-xs tracking-wider"></p>
            <p id="preview-desc" class="text-zinc-300 text-sm mt-1"></p>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz0gBWEtCoZgA6FXrp82zkB24q77vUN1qDLjINEj8qi7Fsoj1yGK-ylTM4ch7380V8IPw/exec";

        let currentFacingMode = "environment"; 
        let videoTrack = null;
        let currentCoords = null;
        let currentAddress = "Mencari lokasi...";
        let currentZoomLevel = 1.0;
        let galleryData = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadProfil();
            initCameraAndGps();
        });

        async function initCameraAndGps() {
            try {
                if (videoTrack) { videoTrack.stop(); }
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: currentFacingMode, 
                        width: { ideal: 1080, max: 1080 }, 
                        height: { ideal: 1920, max: 1920 },
                        aspectRatio: { ideal: 0.5625 } 
                    } 
                });
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                applyZoom(currentZoomLevel);
            } catch (err) {
                alert("Gagal mengakses kamera: " + err.message);
            }

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        currentCoords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                        fetchAddressFromCoords(pos.coords.latitude, pos.coords.longitude);
                    },
                    (err) => { currentAddress = "GPS lokasi tidak didapatkan"; },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            }
        }

        async function fetchAddressFromCoords(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=id`);
                const data = await res.json();
                if (data && data.display_name) {
                    const a = data.address;
                    currentAddress = (a.road || a.pedestrian || a.suburb || data.name || "Lokasi") + ", " + (a.village || a.city_district || a.city || "");
                }
            } catch (e) {
                currentAddress = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
            }
        }

        function flipCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            initCameraAndGps();
        }

        function setZoom(level, btnElem) {
            currentZoomLevel = level;
            document.querySelectorAll('.zoom-btn').forEach(btn => btn.classList.remove('zoom-active'));
            btnElem.classList.add('zoom-active');
            applyZoom(level);
        }

        function applyZoom(level) {
            document.getElementById('webcam').style.transform = `scale(${level})`;
        }

        async function toggleFlash() {
            if (videoTrack && videoTrack.getCapabilities().torch) {
                try {
                    const settings = videoTrack.getSettings();
                    await videoTrack.applyConstraints({ advanced: [{ torch: !settings.torch }] });
                } catch (e) { alert("Senter tidak dapat diaktifkan"); }
            }
        }

        function toggleModal(id) {
            document.getElementById(`modal-${id}`).classList.toggle('hidden');
        }

        function loadProfil() {
            const savedNama = localStorage.getItem('workcam_nama');
            if (savedNama) { document.getElementById('profil-nama').value = savedNama; }
        }

        function saveProfil() {
            const nama = document.getElementById('profil-nama').value;
            if (nama) {
                localStorage.setItem('workcam_nama', nama);
                toggleModal('profil');
            }
        }

        // --- PROSES AMBIL FOTO TANPA POP-UP ---
        async function processPhotoWorkflow() {
            const desc = document.getElementById('input-desc').value || "Dokumentasi Pekerjaan";
            const namaField = localStorage.getItem('workcam_nama') || "Heri Prasetyo";

            try {
                const stampedBase64 = await createStampedImage(desc, namaField);
                uploadPhotoToGas(stampedBase64, desc); // Async background save
            } catch (err) {
                console.error("Gagal mengambil foto:", err);
            }
        }

        function createStampedImage(desc, nama) {
            return new Promise((resolve) => {
                const video = document.getElementById('webcam');
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');

                let vWidth = video.videoWidth || 1080;
                let vHeight = video.videoHeight || 1920;

                if (vWidth > vHeight) {
                    canvas.width = vHeight;
                    canvas.height = vWidth;
                } else {
                    canvas.width = vWidth;
                    canvas.height = vHeight;
                }

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Watermark Floating Styled Card
                const cardMargin = Math.round(canvas.width * 0.04);
                const cardWidth = canvas.width - (cardMargin * 2);
                const cardHeight = Math.round(canvas.height * 0.22);
                const cardX = cardMargin;
                const cardY = canvas.height - cardHeight - Math.round(canvas.height * 0.08);

                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.roundRect(cardX, cardY, cardWidth, cardHeight, Math.round(cardWidth * 0.05));
                ctx.fill();
                ctx.restore();

                const mapMargin = Math.round(cardWidth * 0.04);
                const mapSize = Math.round(cardHeight * 0.42);
                const mapX = cardX + mapMargin;
                const mapY = cardY + mapMargin;

                ctx.fillStyle = "#e5e7eb";
                ctx.beginPath();
                ctx.roundRect(mapX, mapY, mapSize, mapSize, Math.round(mapSize * 0.2));
                ctx.fill();

                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = Math.round(mapSize * 0.1);
                ctx.beginPath();
                ctx.moveTo(mapX, mapY + mapSize * 0.5);
                ctx.lineTo(mapX + mapSize, mapY + mapSize * 0.5);
                ctx.stroke();

                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(mapX + mapSize * 0.5, mapY + mapSize * 0.4, mapSize * 0.15, 0, Math.PI * 2);
                ctx.fill();

                const textX = mapX + mapSize + Math.round(cardWidth * 0.04);
                let currentY = mapY + Math.round(mapSize * 0.25);
                const fontSizeMain = Math.round(cardHeight * 0.09);

                ctx.fillStyle = "#0f172a";
                ctx.font = `bold ${fontSizeMain}px sans-serif`;
                ctx.textBaseline = "top";
                ctx.fillText(currentAddress.substring(0, 32), textX, currentY);

                currentY += Math.round(fontSizeMain * 1.4);
                const fontSizeSub = Math.round(cardHeight * 0.07);
                ctx.fillStyle = "#64748b";
                ctx.font = `${fontSizeSub}px sans-serif`;
                const coordsText = currentCoords ? `Lat: ${currentCoords.split(',')[0]}, Long: ${currentCoords.split(',')[1]}` : "Lat: -6.9666, Long: 110.4166";
                ctx.fillText(coordsText, textX, currentY);

                const dividerY = mapY + mapSize + Math.round(cardHeight * 0.06);
                ctx.strokeStyle = "#f1f5f9";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cardX + mapMargin, dividerY);
                ctx.lineTo(cardX + cardWidth - mapMargin, dividerY);
                ctx.stroke();

                const now = new Date();
                const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' });

                const col1X = cardX + mapMargin;
                const col2X = cardX + (cardWidth / 2) + Math.round(mapMargin * 0.5);
                const bottomY = dividerY + Math.round(cardHeight * 0.06);

                ctx.fillStyle = "#2563eb";
                ctx.beginPath();
                ctx.arc(col1X + Math.round(fontSizeMain * 0.7), bottomY + Math.round(fontSizeMain * 0.7), Math.round(fontSizeMain * 0.6), 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#1e40af";
                ctx.font = `bold ${Math.round(fontSizeMain * 1.1)}px sans-serif`;
                ctx.fillText(timeStr, col1X + Math.round(fontSizeMain * 1.8), bottomY);

                ctx.fillStyle = "#64748b";
                ctx.font = `${Math.round(fontSizeSub * 0.85)}px sans-serif`;
                ctx.fillText(dateStr, col1X + Math.round(fontSizeMain * 1.8), bottomY + Math.round(fontSizeMain * 1.3));

                ctx.fillStyle = "#2563eb";
                ctx.beginPath();
                ctx.arc(col2X + Math.round(fontSizeMain * 0.7), bottomY + Math.round(fontSizeMain * 0.7), Math.round(fontSizeMain * 0.6), 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#1e40af";
                ctx.font = `bold ${Math.round(fontSizeMain * 1.1)}px sans-serif`;
                ctx.fillText("337°", col2X + Math.round(fontSizeMain * 1.8), bottomY);

                ctx.fillStyle = "#64748b";
                ctx.font = `${Math.round(fontSizeSub * 0.85)}px sans-serif`;
                ctx.fillText("NorthEast", col2X + Math.round(fontSizeMain * 1.8), bottomY + Math.round(fontSizeMain * 1.3));

                resolve(canvas.toDataURL('image/jpeg', 0.9));
            });
        }

        async function uploadPhotoToGas(base64Image, desc) {
            const dateKey = new Date().toISOString().split('T')[0];
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    image: base64Image,
                    date: dateKey,
                    fullTimestamp: new Date().toLocaleString('id-ID'),
                    location: currentAddress,
                    coords: currentCoords || "",
                    description: desc
                })
            });
        }

        // --- MANAJEMEN GALERI SAMA DENGAN DESAIN UI ---
        function openGalleryTab() {
            toggleModal('gallery');
            fetchGalleryData();
        }

        async function fetchGalleryData() {
            const feed = document.getElementById('view-feed');
            const loading = document.getElementById('gallery-loading');

            feed.innerHTML = "";
            loading.classList.remove('hidden');

            try {
                const response = await fetch(GAS_URL);
                galleryData = await response.json();
                loading.classList.add('hidden');

                renderGalleryFeed(galleryData);
                renderGalleryCalendar(galleryData);
            } catch (err) {
                loading.classList.add('hidden');
                feed.innerHTML = `<div class="text-center py-10 text-zinc-600 text-xs">Gagal memuat arsip foto.</div>`;
            }
        }

        function renderGalleryFeed(data) {
            const feed = document.getElementById('view-feed');
            feed.innerHTML = "";

            if (!data || data.length === 0) {
                feed.innerHTML = `<div class="text-center py-12 text-zinc-600 text-xs">Belum ada foto tersimpan.</div>`;
                return;
            }

            // Kelompokkan foto berdasarkan Tanggal (Group Feed)
            const groups = {};
            data.forEach(item => {
                const key = item.date || "Terbaru";
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });

            for (const [dateGroup, items] of Object.entries(groups)) {
                let html = `<div><h3 class="text-sm font-semibold text-zinc-400 mb-3">${dateGroup}</h3><div class="grid grid-cols-4 gap-2.5">`;
                items.forEach((item, idx) => {
                    html += `
                        <div onclick="openPreview('${item.url}', '${item.date}', '${item.description}')" class="aspect-square bg-zinc-900 rounded-2xl overflow-hidden border border-white/5 active:scale-95 transition cursor-pointer relative">
                            <img src="${item.url}" class="w-full h-full object-cover">
                        </div>`;
                });
                html += `</div></div>`;
                feed.innerHTML += html;
            }
        }

        function renderGalleryCalendar(data) {
            const calendarGrid = document.getElementById('calendar-grid');
            calendarGrid.innerHTML = "";

            // Buat Grid Tanggal 1 s.d 31 Bulan Berjalan
            const mapPhotoByDay = {};
            data.forEach(item => {
                if (item.date) {
                    const dayNum = parseInt(item.date.split('-')[2]);
                    mapPhotoByDay[dayNum] = item;
                }
            });

            for (let day = 1; day <= 31; day++) {
                const photo = mapPhotoByDay[day];
                if (photo) {
                    calendarGrid.innerHTML += `
                        <div onclick="openPreview('${photo.url}', '${photo.date}', '${photo.description}')" class="aspect-square rounded-2xl overflow-hidden border border-yellow-500/50 relative cursor-pointer active:scale-95 transition">
                            <img src="${photo.url}" class="w-full h-full object-cover brightness-75">
                            <span class="absolute inset-0 flex items-center justify-center font-bold text-xs text-white drop-shadow-md">${day}</span>
                        </div>`;
                } else {
                    calendarGrid.innerHTML += `
                        <div class="aspect-square bg-zinc-900/60 rounded-2xl border border-white/5 flex items-center justify-center text-zinc-700 font-medium text-xs">
                            ${day}
                        </div>`;
                }
            }
        }

        function switchGalleryView(view) {
            const feed = document.getElementById('view-feed');
            const calendar = document.getElementById('view-calendar');
            const tabFeed = document.getElementById('tab-feed');
            const tabCal = document.getElementById('tab-calendar');

            if (view === 'feed') {
                feed.classList.remove('hidden');
                calendar.classList.add('hidden');
                tabFeed.classList.replace('text-zinc-500', 'text-white');
                tabCal.classList.replace('text-white', 'text-zinc-500');
            } else {
                feed.classList.add('hidden');
                calendar.classList.remove('hidden');
                tabCal.classList.replace('text-zinc-500', 'text-white');
                tabFeed.classList.replace('text-white', 'text-zinc-500');
            }
        }

        // --- LIGHTBOX PREVIEW (IMAGE CLICK) ---
        function openPreview(url, date, desc) {
            document.getElementById('preview-img').src = url;
            document.getElementById('preview-date').innerText = date || "";
            document.getElementById('preview-desc').innerText = desc || "";
            document.getElementById('modal-preview').classList.remove('hidden');
        }

        function closePreview() {
            document.getElementById('modal-preview').classList.add('hidden');
        }
    </script>
</body>
</html>
