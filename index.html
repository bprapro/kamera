<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkCam Native UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; overflow: hidden; -webkit-font-smoothing: antialiased; }
        
        /* Grid Overlay Kamera Native */
        .grid-lines { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; }
        .grid-lines div { border: 0.5px solid rgba(255, 255, 255, 0.25); }

        /* Zoom Pill Indicator */
        .zoom-pill { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); border-radius: 9999px; }
        .zoom-btn { width: 36px; height: 36px; display: flex; items-center: center; justify-content: center; border-radius: 50%; font-size: 12px; font-weight: bold; transition: all 0.2s; }
        .zoom-active { background-color: rgba(255, 255, 255, 0.2); color: #facc15; border: 1px solid #facc15; }

        /* Reset Element UI Browser */
        input, textarea, button { -webkit-appearance: none; border-radius: 0; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
    </style>
</head>
<body class="font-sans h-screen w-screen relative select-none">

    <!-- CAMERA CONTAINER (Full Screen Responsive) -->
    <div class="relative w-full h-full bg-black overflow-hidden flex items-center justify-center">
        
        <!-- Video Stream -->
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover transition-transform duration-300"></video>
        <canvas id="canvas" class="hidden"></canvas>

        <!-- Grid Lines 3x3 Overlay -->
        <div class="absolute inset-0 grid-lines z-10">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
        </div>

        <!-- TOP BAR UI (Flash, Resolution, Settings) -->
        <div class="absolute top-0 left-0 right-0 z-20 p-5 pt-8 bg-gradient-to-b from-black/80 via-black/30 to-transparent flex justify-between items-center text-white">
            <button id="btn-flash" onclick="toggleFlash()" class="p-2 rounded-full active:scale-95 text-lg">⚡</button>
            <span class="text-xs font-semibold tracking-wider bg-black/40 px-2.5 py-1 rounded-full border border-white/20">12M</span>
            <button onclick="toggleModal('profil')" class="p-2 text-sm bg-black/40 rounded-full border border-white/20 active:scale-95">👤 Profil</button>
            <button onclick="toggleModal('desc')" class="p-2 text-sm bg-black/40 rounded-full border border-white/20 active:scale-95">📝 Catatan</button>
        </div>

        <!-- BOTTOM CONTROL PANEL UI -->
        <div class="absolute bottom-0 left-0 right-0 z-20 pb-8 pt-12 bg-gradient-to-t from-black via-black/80 to-transparent flex flex-col items-center gap-5">
            
            <!-- Zoom Controller (.6x, 1x, 2x, 3x) -->
            <div class="zoom-pill flex items-center p-1 gap-1 border border-white/10">
                <button onclick="setZoom(0.6, this)" class="zoom-btn text-white/70">.6</button>
                <button onclick="setZoom(1.0, this)" class="zoom-btn zoom-active">1x</button>
                <button onclick="setZoom(2.0, this)" class="zoom-btn text-white/70">2</button>
                <button onclick="setZoom(3.0, this)" class="zoom-btn text-white/70">3</button>
            </div>

            <!-- Shutter Controls Bar -->
            <div class="w-full px-8 flex items-center justify-between">
                <!-- Gallery Preview Thumbnail -->
                <button onclick="openGalleryTab()" class="w-12 h-12 rounded-full border-2 border-white/50 overflow-hidden bg-zinc-800 flex items-center justify-center active:scale-95 transition">
                    <span id="gallery-icon" class="text-xs text-white/50">🖼️</span>
                </button>

                <!-- Native White Shutter Button -->
                <button onclick="processPhotoWorkflow()" class="w-20 h-20 bg-white rounded-full border-4 border-zinc-400 active:scale-90 transition shadow-2xl flex items-center justify-center">
                    <div class="w-16 h-16 rounded-full border-2 border-black/10"></div>
                </button>

                <!-- Camera Flip Button -->
                <button onclick="flipCamera()" class="w-12 h-12 rounded-full bg-zinc-800/80 border border-white/20 flex items-center justify-center text-xl active:rotate-180 transition-transform duration-300">
                    🔄
                </button>
            </div>

            <!-- Mode Selector Slider -->
            <div class="flex justify-center gap-6 text-xs font-bold tracking-widest text-white/60 pt-2">
                <span class="hover:text-white cursor-pointer">PORTRAIT</span>
                <span class="text-yellow-400 border-b-2 border-yellow-400 pb-0.5">PHOTO</span>
                <span class="hover:text-white cursor-pointer">VIDEO</span>
                <span class="hover:text-white cursor-pointer">MORE</span>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP: PROFIL USER -->
    <div id="modal-profil" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-3xl max-w-xs w-full relative shadow-2xl">
            <button onclick="toggleModal('profil')" class="absolute top-4 right-4 text-zinc-400 hover:text-white">✕</button>
            <h3 class="text-lg font-bold mb-4 text-yellow-400">Identitas Pengambil Foto</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-zinc-400">Nama Lengkap (Akan Dicetak ke Watermark)</label>
                    <input type="text" id="profil-nama" value="Heri Prasetyo" class="w-full mt-1 p-3 bg-zinc-800 border border-zinc-700 rounded-xl text-sm text-white focus:outline-none focus:border-yellow-400">
                </div>
                <button onclick="saveProfil()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-xl hover:bg-yellow-300 transition">SIMPAN</button>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP: KETERANGAN FOTO -->
    <div id="modal-desc" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-3xl max-w-xs w-full relative shadow-2xl">
            <button onclick="toggleModal('desc')" class="absolute top-4 right-4 text-zinc-400 hover:text-white">✕</button>
            <h3 class="text-lg font-bold mb-4 text-yellow-400">Keterangan Pekerjaan</h3>
            <div class="space-y-4">
                <textarea id="input-desc" rows="4" placeholder="Masukkan rincian pekerjaan di sini..." class="w-full p-3 bg-zinc-800 border border-zinc-700 rounded-xl text-sm text-white focus:outline-none focus:border-yellow-400"></textarea>
                <button onclick="toggleModal('desc')" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-xl hover:bg-yellow-300 transition">GUNAKAN TEKS INI</button>
            </div>
        </div>
    </div>

    <!-- MODAL GALERI FOTO -->
    <div id="modal-gallery" class="fixed inset-0 bg-black hidden z-[100] flex flex-col p-4 overflow-y-auto">
        <div class="flex justify-between items-center py-4 border-b border-zinc-800">
            <h2 class="text-lg font-bold text-white">Arsip Galeri Drive</h2>
            <button onclick="toggleModal('gallery')" class="text-white font-bold text-lg bg-zinc-800 px-3 py-1 rounded-full">✕ Tutup</button>
        </div>
        <div id="gallery-grid" class="grid grid-cols-2 gap-3 mt-4">
            <!-- Items galeri di-load via JavaScript -->
        </div>
        <div id="gallery-loading" class="hidden text-center py-12 text-zinc-500 text-sm">Mengambil data dari Google Drive...</div>
    </div>

    <!-- LOADING OVERLAY PROSES SIMPAN -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/90 hidden z-[200] flex flex-col items-center justify-center p-6 text-center backdrop-blur-md">
        <div class="w-16 h-16 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin mb-6"></div>
        <h2 class="text-xl font-bold text-white mb-1">MEMPROSES FOTO</h2>
        <p class="text-xs text-zinc-400">Menempel stempel solid putih & mengirim ke Google Drive...</p>
    </div>

    <script>
        // GOOGLE APPS SCRIPT URL ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz0gBWEtCoZgA6FXrp82zkB24q77vUN1qDLjINEj8qi7Fsoj1yGK-ylTM4ch7380V8IPw/exec";

        let currentFacingMode = "environment"; 
        let videoTrack = null;
        let currentCoords = null;
        let currentAddress = "Mencari alamat lokasi...";
        let currentZoomLevel = 1.0;

        document.addEventListener('DOMContentLoaded', () => {
            loadProfil();
            initCameraAndGps();
        });

        // --- INISIALISASI KAMERA & GPS ---
        async function initCameraAndGps() {
            try {
                if (videoTrack) { videoTrack.stop(); }
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode, width: { ideal: 1080 }, height: { ideal: 1440 } } 
                });
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                applyZoom(currentZoomLevel);
            } catch (err) {
                alert("Gagal mengakses kamera: " + err.message);
            }

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        currentCoords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                        fetchAddressFromCoords(pos.coords.latitude, pos.coords.longitude);
                    },
                    (err) => { currentAddress = "GPS lokasi tidak didapatkan"; },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            }
        }

        async function fetchAddressFromCoords(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=id`);
                const data = await res.json();
                if (data && data.display_name) {
                    const a = data.address;
                    currentAddress = (a.road || a.pedestrian || a.suburb || data.name || "Lokasi") + ", " + (a.village || a.city_district || a.city || "");
                }
            } catch (e) {
                currentAddress = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
            }
        }

        // --- KONTROL KAMERA (ZOOM, FLIP, FLASH) ---
        function flipCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            initCameraAndGps();
        }

        function setZoom(level, btnElem) {
            currentZoomLevel = level;
            document.querySelectorAll('.zoom-btn').forEach(btn => btn.classList.remove('zoom-active'));
            btnElem.classList.add('zoom-active');
            applyZoom(level);
        }

        function applyZoom(level) {
            const video = document.getElementById('webcam');
            video.style.transform = `scale(${level})`;
        }

        async function toggleFlash() {
            if (videoTrack && videoTrack.getCapabilities().torch) {
                try {
                    const settings = videoTrack.getSettings();
                    await videoTrack.applyConstraints({ advanced: [{ torch: !settings.torch }] });
                } catch (e) { alert("Senter tidak dapat diaktifkan"); }
            } else {
                alert("Fitur Flash/Torch tidak didukung di perangkat ini");
            }
        }

        // --- UTILITY MODAL & PROFIL ---
        function toggleModal(id) {
            document.getElementById(`modal-${id}`).classList.toggle('hidden');
        }

        function loadProfil() {
            const savedNama = localStorage.getItem('workcam_nama');
            if (savedNama) { document.getElementById('profil-nama').value = savedNama; }
        }

        function saveProfil() {
            const nama = document.getElementById('profil-nama').value;
            if (nama) {
                localStorage.setItem('workcam_nama', nama);
                toggleModal('profil');
                alert("Nama tersimpan!");
            }
        }

        // --- PROSES PENGAMBILAN & STAMPING FOTO ---
        async function processPhotoWorkflow() {
            const desc = document.getElementById('input-desc').value || "Dokumentasi Pekerjaan";
            const namaField = localStorage.getItem('workcam_nama') || "Heri Prasetyo";

            document.getElementById('loading-overlay').classList.remove('hidden');

            try {
                const stampedBase64 = await createStampedImage(desc, namaField);
                await uploadPhotoToGas(stampedBase64, desc);
                document.getElementById('loading-overlay').classList.add('hidden');
                alert("Foto berhasil diproses & disimpan!");
            } catch (err) {
                document.getElementById('loading-overlay').classList.add('hidden');
                alert("Gagal memproses foto: " + err);
            }
        }

        function createStampedImage(desc, nama) {
            return new Promise((resolve) => {
                const video = document.getElementById('webcam');
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = video.videoWidth || 1080;
                canvas.height = video.videoHeight || 1440;

                // 1. Render Frame Video
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // 2. Render Box Solid Putih di Bagian Bawah Foto (Tinggi 18%)
                const overlayHeight = Math.round(canvas.height * 0.18);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, canvas.height - overlayHeight, canvas.width, overlayHeight);

                // 3. Render Teks Stempel
                const fontSize = Math.round(canvas.height * 0.032);
                ctx.fillStyle = "#1e293b"; 
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textBaseline = "top";

                const paddingX = Math.round(canvas.width * 0.05);
                const startY = canvas.height - overlayHeight + (overlayHeight * 0.15);
                const lineSpacing = Math.round(fontSize * 1.4);

                const now = new Date();
                const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

                ctx.fillText(`👤 Nama: ${nama.toUpperCase()}`, paddingX, startY);
                ctx.fillText(`📍 Lokasi: ${currentAddress.substring(0, 48)}`, paddingX, startY + lineSpacing);
                ctx.fillText(`⏰ Waktu: ${timeStr} | ${dateStr}`, paddingX, startY + (lineSpacing * 2));

                resolve(canvas.toDataURL('image/jpeg', 0.9));
            });
        }

        async function uploadPhotoToGas(base64Image, desc) {
            const dateKey = new Date().toISOString().split('T')[0];
            const timestampData = new Date().toLocaleString('id-ID');

            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    image: base64Image,
                    date: dateKey,
                    fullTimestamp: timestampData,
                    location: currentAddress,
                    coords: currentCoords || "",
                    description: desc
                })
            });
        }

        // --- GALERI SYSTEM ---
        function openGalleryTab() {
            toggleModal('gallery');
            fetchGalleryData();
        }

        async function fetchGalleryData() {
            const grid = document.getElementById('gallery-grid');
            const loading = document.getElementById('gallery-loading');

            grid.innerHTML = "";
            loading.classList.remove('hidden');

            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                loading.classList.add('hidden');

                if (data && data.length > 0) {
                    data.forEach(item => {
                        grid.innerHTML += `
                            <div class="relative aspect-[3/4] bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800">
                                <img src="${item.url}" class="w-full h-full object-cover">
                                <div class="absolute inset-x-0 bottom-0 p-2 bg-black/80">
                                    <p class="text-[9px] font-bold text-yellow-400">${item.date}</p>
                                    <p class="text-[8px] text-zinc-300 truncate">${item.description}</p>
                                </div>
                            </div>`;
                    });
                } else {
                    grid.innerHTML = `<div class="col-span-2 text-center py-10 text-zinc-600 text-xs">Arsip galeri kosong.</div>`;
                }
            } catch (err) {
                loading.classList.add('hidden');
                grid.innerHTML = `<div class="col-span-2 text-center py-10 text-red-500 text-xs">Gagal memuat galeri.</div>`;
            }
        }
    </script>
</body>
</html>
