<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkCam Doc v2.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0e17; color: #e0e6ed; -webkit-font-smoothing: antialiased; }
        .cyber-panel { background: rgba(20, 26, 38, 0.75); backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.2); }
        .cyber-border { border-color: rgba(56, 189, 248, 0.3); }
        .text-glow { text-shadow: 0 0 8px rgba(56, 189, 248, 0.6); }
        .bg-glow { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .tab-active { color: #38bdf8; position: relative; }
        .tab-active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background-color: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
        .animate-scan { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #38bdf8, transparent); animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        input, textarea, button { -webkit-appearance: none; border-radius: 0; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 5px; }
    </style>
</head>
<body class="font-sans flex flex-col h-screen">

    <!-- Header / Navbar -->
    <header class="cyber-panel px-4 py-3 shadow-lg z-50 fixed top-0 left-0 right-0">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-2 h-6 bg-blue-500 rounded bg-glow"></div>
                <h1 class="font-bold text-xl tracking-tight text-glow">Work<span class="text-blue-400">Cam</span> Doc</h1>
            </div>
            <div class="flex gap-1">
                <button onclick="toggleModal('profil')" class="p-2 rounded-lg hover:bg-white/5 border cyber-border text-slate-400">👤</button>
            </div>
        </div>
        <div class="flex border-b cyber-border mt-3 text-sm">
            <button id="nav-camera" onclick="switchTab('camera')" class="w-1/2 text-center py-2 tab-active text-slate-300 font-medium">KAMERA</button>
            <button id="nav-gallery" onclick="switchTab('gallery')" class="w-1/2 text-center py-2 text-slate-500 font-medium">GALERI</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow pt-[110px] pb-[80px] px-4 overflow-y-auto">

        <!-- TAB KAMERA -->
        <section id="tab-camera" class="max-w-md mx-auto space-y-4">
            <div class="relative bg-black rounded-3xl overflow-hidden shadow-2xl bg-glow aspect-[3/4] cyber-border">
                <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="canvas" class="hidden"></canvas>
                <div class="animate-scan"></div>
                <div class="absolute bottom-4 left-4 right-4 flex items-center justify-between px-3 py-2 cyber-panel rounded-full text-xs text-blue-300">
                    <span id="ui-timestamp">...</span>
                    <span id="ui-location">Mencari GPS...</span>
                </div>
            </div>

            <div class="cyber-panel p-5 rounded-3xl space-y-3">
                <label class="text-[11px] font-bold text-blue-400 uppercase tracking-widest text-glow">Keterangan Pekerjaan</label>
                <textarea id="input-desc" rows="3" placeholder="Masukkan detail pekerjaan yang akan distempel ke foto..." class="w-full p-4 bg-white/5 border cyber-border rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder:text-slate-600 text-white"></textarea>
            </div>
        </section>

        <!-- TAB GALERI -->
        <section id="tab-gallery" class="hidden max-w-md mx-auto space-y-4">
            <div class="cyber-panel p-4 rounded-3xl space-y-4">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-lg font-bold text-slate-200">Arsip Foto</h2>
                    <div class="flex gap-2">
                        <input type="month" id="gallery-date-filter" class="p-2 text-xs bg-white/5 border cyber-border rounded-lg text-white focus:outline-none">
                        <button onclick="fetchGalleryData()" class="p-2 text-xs bg-blue-600 rounded-lg font-bold">Refresh</button>
                    </div>
                </div>
                <div id="gallery-grid" class="grid grid-cols-2 gap-3"></div>
                <div id="gallery-loading" class="hidden text-center py-10 text-slate-500 text-sm">Mengambil data dari server Google Drive...</div>
            </div>
        </section>

    </main>

    <!-- Footer Action -->
    <footer class="fixed bottom-0 left-0 right-0 p-4 z-40 bg-gradient-to-t from-[#0a0e17] via-[#0a0e17]/90 to-transparent">
        <div id="footer-camera-action" class="max-w-md mx-auto">
            <button onclick="processPhotoWorkflow()" class="w-full flex items-center justify-center gap-3 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-blue-500 transition active:scale-95 text-lg">
                <span class="text-xl">📸</span> AMBIL & PROSES DOKUMEN
            </button>
        </div>
    </footer>

    <!-- MODAL PROFIL -->
    <div id="modal-profil" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="cyber-panel p-6 rounded-3xl max-w-xs w-full cyber-border relative shadow-2xl">
            <button onclick="toggleModal('profil')" class="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
            <h3 class="text-xl font-bold mb-5 text-blue-400 text-glow">Konfigurasi Pengambil Foto</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400">Nama Lengkap (Stempel Foto)</label>
                    <input type="text" id="profil-nama" value="Heri Prasetyo" placeholder="Masukkan nama Anda" class="w-full mt-1 p-3 bg-white/5 border cyber-border rounded-lg text-sm text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <button onclick="saveProfil()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-500 transition">SIMPAN PERUBAHAN</button>
            </div>
        </div>
    </div>

    <!-- MODAL VIEW DETAIL FOTO -->
    <div id="modal-photo" class="fixed inset-0 bg-black/90 hidden z-[100] flex items-center justify-center p-4 overflow-y-auto">
        <div class="max-w-xl w-full relative">
            <button onclick="toggleModal('photo')" class="absolute top-2 right-2 bg-black/60 text-white rounded-full w-9 h-9 flex items-center justify-center font-bold z-10 hover:bg-red-500">✕</button>
            <img id="modal-img" src="" class="w-full h-auto object-contain rounded-2xl shadow-xl">
            <div class="mt-4 cyber-panel p-5 rounded-2xl text-xs space-y-2.5">
                <p><strong><span class="text-slate-500">📅 Waktu:</span></strong> <span id="modal-date" class="text-slate-200"></span></p>
                <p><strong><span class="text-slate-500">📍 Lokasi Alamat:</span></strong> <span id="modal-loc" class="text-slate-200"></span></p>
                <p><strong><span class="text-slate-500">📝 Deskripsi:</span></strong> <span id="modal-desc" class="text-slate-200"></span></p>
                <div class="flex gap-2 mt-4">
                    <a id="modal-link" href="#" target="_blank" class="w-1/2 text-center bg-blue-600 text-white py-2.5 rounded-lg font-semibold text-xs transition">Buka di Drive</a>
                    <button onclick="sharePhotoLink()" class="w-1/2 text-center bg-white/5 text-slate-300 py-2.5 rounded-lg font-semibold text-xs border cyber-border transition">Bagikan Link</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/90 hidden z-[200] flex-col items-center justify-center p-6 text-center backdrop-blur-sm">
        <div class="w-24 h-24 border-8 border-blue-500 border-t-transparent rounded-full animate-spin bg-glow mb-8"></div>
        <h2 class="text-3xl font-bold text-white mb-2 text-glow">MENYIMPAN DOKUMEN</h2>
        <p id="loading-status" class="text-blue-300 max-w-xs">Menempel stempel solid putih dan mengirim ke Google Drive...</p>
    </div>

    <script>
        // TAUTAN GOOGLE APPS SCRIPT ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz0gBWEtCoZgA6FXrp82zkB24q77vUN1qDLjINEj8qi7Fsoj1yGK-ylTM4ch7380V8IPw/exec";

        let currentCoords = null;
        let currentAddress = "Mencari nama jalan...";
        let isGpsSuccess = false;

        document.addEventListener('DOMContentLoaded', () => {
            loadProfil();
            initWebcamAndGps();
            updateUiTimestamp();
            const today = new Date();
            document.getElementById('gallery-date-filter').value = today.toISOString().slice(0, 7);
        });

        function loadProfil() {
            const savedNama = localStorage.getItem('workcam_nama');
            if (savedNama) {
                document.getElementById('profil-nama').value = savedNama;
            }
        }

        function saveProfil() {
            const nama = document.getElementById('profil-nama').value;
            if (nama) {
                localStorage.setItem('workcam_nama', nama);
                toggleModal('profil');
                alert("Profil berhasil disimpan!");
            }
        }

        function updateUiTimestamp() {
            const now = new Date();
            document.getElementById('ui-timestamp').innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' | ' + now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
            setTimeout(updateUiTimestamp, 60000);
        }

        async function initWebcamAndGps() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1440 } } });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {
                alert("Gagal mengakses kamera: " + err.message);
            }

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        currentCoords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                        isGpsSuccess = true;
                        document.getElementById('ui-location').innerText = "GPS Terkunci";
                        fetchAddressFromCoords(pos.coords.latitude, pos.coords.longitude);
                    },
                    (err) => {
                        document.getElementById('ui-location').innerText = "GPS Gagal";
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            }
        }

        async function fetchAddressFromCoords(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=id`);
                const data = await res.json();
                if (data && data.display_name) {
                    const a = data.address;
                    currentAddress = (a.road || a.pedestrian || a.suburb || data.name || "Lokasi terdekat") + ", " + (a.village || a.city_district || a.city || "");
                }
            } catch (e) {
                currentAddress = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
            }
        }

        function toggleModal(id) {
            document.getElementById(`modal-${id}`).classList.toggle('hidden');
        }

        function switchTab(tab) {
            const camSec = document.getElementById('tab-camera');
            const galSec = document.getElementById('tab-gallery');
            const navCam = document.getElementById('nav-camera');
            const navGal = document.getElementById('nav-gallery');
            const footerCam = document.getElementById('footer-camera-action');

            if (tab === 'camera') {
                camSec.classList.remove('hidden'); galSec.classList.add('hidden');
                navCam.className = "w-1/2 text-center py-2 tab-active text-slate-300 font-medium";
                navGal.className = "w-1/2 text-center py-2 text-slate-500 font-medium";
                footerCam.classList.remove('hidden');
            } else {
                camSec.classList.add('hidden'); galSec.classList.remove('hidden');
                navGal.className = "w-1/2 text-center py-2 tab-active text-slate-300 font-medium";
                navCam.className = "w-1/2 text-center py-2 text-slate-500 font-medium";
                footerCam.classList.add('hidden');
                fetchGalleryData();
            }
        }

        async function processPhotoWorkflow() {
            const desc = document.getElementById('input-desc').value;
            const namaField = localStorage.getItem('workcam_nama') || "Heri Prasetyo";

            if (!desc) { alert("Harap masukkan keterangan pekerjaan."); return; }

            document.getElementById('loading-overlay').classList.remove('hidden');

            try {
                const stampedImageBase64 = await createStampedImage(desc, namaField);
                await uploadPhotoToGas(stampedImageBase64, desc);
                document.getElementById('loading-overlay').classList.add('hidden');
                document.getElementById('input-desc').value = "";
                alert("Foto berhasil disimpan ke Google Drive dengan Watermark Solid Putih!");
            } catch (err) {
                document.getElementById('loading-overlay').classList.add('hidden');
                alert("Gagal memproses foto: " + err);
            }
        }

        // PERBAIKAN: Fungsi createStampedImage agar tidak terpotong
        function createStampedImage(desc, nama) {
            return new Promise((resolve) => {
                const video = document.getElementById('webcam');
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');

                // Gunakan dimensi visual video di layar, agar watermark proporsional dengan yang terlihat
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // 1. Gambar frame video asli
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // 2. Buat Stempel Solid Putih di Bagian Bawah
                // Kita gunakan persentase yang lebih aman agar tidak terlalu mepet
                const overlayHeight = Math.round(canvas.height * 0.18); 
                ctx.fillStyle = "#ffffff"; 
                ctx.fillRect(0, canvas.height - overlayHeight, canvas.width, overlayHeight);

                // 3. Tambahkan Teks 
                const fontSize = Math.round(canvas.height * 0.035); // Font disesuaikan dengan tinggi canvas
                ctx.fillStyle = "#1e293b"; 
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textBaseline = "top";

                const paddingX = Math.round(canvas.width * 0.05); // Padding 5% dari lebar
                const startY = canvas.height - overlayHeight + (overlayHeight * 0.2); 
                const lineSpacing = Math.round(fontSize * 1.5);

                const now = new Date();
                const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

                // Render Teks
                ctx.fillText(`👤 Nama: ${nama.toUpperCase()}`, paddingX, startY);
                ctx.fillText(`📍 Lokasi: ${currentAddress.substring(0, 45)}...`, paddingX, startY + lineSpacing);
                ctx.fillText(`⏰ Waktu: ${timeStr} | ${dateStr}`, paddingX, startY + (lineSpacing * 2));

                resolve(canvas.toDataURL('image/jpeg', 0.9)); 
            });
        }

        async function uploadPhotoToGas(base64Image, desc) {
            const dateKey = new Date().toISOString().split('T')[0];
            const timestampData = new Date().toLocaleString('id-ID');

            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    image: base64Image,
                    date: dateKey,
                    fullTimestamp: timestampData,
                    location: currentAddress,
                    coords: currentCoords || "",
                    description: desc
                })
            });
        }

        async function fetchGalleryData() {
            const grid = document.getElementById('gallery-grid');
            const loading = document.getElementById('gallery-loading');
            const dateFilter = document.getElementById('gallery-date-filter').value;

            grid.innerHTML = "";
            loading.classList.remove('hidden');

            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                loading.classList.add('hidden');

                if (data && data.length > 0) {
                    let filteredData = data;
                    if (dateFilter) {
                        filteredData = data.filter(item => item.date && item.date.startsWith(dateFilter));
                    }

                    if (filteredData.length === 0) {
                        grid.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-600 text-xs">Foto bulan ini belum ada.</div>`;
                        return;
                    }

                    filteredData.forEach(item => {
                        grid.innerHTML += `
                            <div onclick="openPhotoModal('${item.url}', '${item.fullTimestamp}', '${item.location}', '${item.description}')" 
                                 class="relative aspect-[3/4] bg-white/5 border cyber-border rounded-2xl overflow-hidden cursor-pointer hover:border-blue-400 group transition">
                                <img src="${item.url}" class="w-full h-full object-cover">
                                <div class="absolute inset-x-0 bottom-0 p-2.5 bg-gradient-to-t from-black via-black/70 to-transparent">
                                    <p class="text-[9px] font-bold text-white">${item.date}</p>
                                    <p class="text-[8px] text-slate-300 line-clamp-2">${item.description}</p>
                                </div>
                            </div>`;
                    });
                } else {
                    grid.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-600 text-xs">Arsip galeri kosong.</div>`;
                }
            } catch (err) {
                loading.classList.add('hidden');
                grid.innerHTML = `<div class="col-span-2 text-center py-10 text-red-500 text-xs">Gagal memuat galeri.</div>`;
            }
        }

        function openPhotoModal(url, date, loc, desc) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal-date').innerText = date;
            document.getElementById('modal-loc').innerText = loc;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-link').href = url;
            toggleModal('photo');
            window.currentSharedPhotoLink = url;
        }

        function sharePhotoLink() {
            if (window.currentSharedPhotoLink) {
                navigator.clipboard.writeText(window.currentSharedPhotoLink);
                alert("Link foto disalin ke clipboard!");
            }
        }
    </script>
</body>
</html>
